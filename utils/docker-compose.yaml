# Builds Alder's APK into ./output (utils/output). Usage, release builds and signing: README.md.
services:
  apk:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        # The SDK in the image; changing any of these needs --build once.
        ANDROID_PLATFORM: ${ANDROID_PLATFORM:-android-36}
        BUILD_TOOLS_VERSION: ${BUILD_TOOLS_VERSION:-36.0.0}
        CMDLINE_TOOLS_VERSION: ${CMDLINE_TOOLS_VERSION:-13114758}
    image: alder-apk-builder
    volumes:
      # The repository. Writable only because Gradle 9 refuses a project folder it can't write to: the build sends
      # its writes to utils/cache instead (build.sh).
      - ..:/src
      # utils itself rather than output/ and cache/: Docker would create those as root if missing, and the build
      # user couldn't write to them. Inside it, the build makes:
      #   output/        the APKs
      #   cache/gradle/  Gradle itself and the dependencies
      #   cache/build/   build output and Gradle's per-project state, so later builds are incremental
      #   cache/android/ the debug signing key, so each debug APK installs over the last
      # and reads keys/release.jks (optional): the release signing key.
      - .:/utils
    environment:
      GRADLE_TASK: ${GRADLE_TASK:-assembleDebug}
      # Installs beside the official app (dev.alder) rather than over it. APP_ID= (empty) keeps dev.alder.
      APP_ID: ${APP_ID-dev.alder.dockerbuilt}
      # The name on the TV's home screen and app list. Unset: Alder, as in strings.xml.
      APP_NAME: ${APP_NAME:-}
      # The release key (README.md): used when keys/release.jks exists; without it, release builds use the debug key.
      # Empty alias, key password or keystore fall back to build.sh's defaults.
      SIGNING_STORE_PASSWORD: ${SIGNING_STORE_PASSWORD:-}
      SIGNING_KEY_ALIAS: ${SIGNING_KEY_ALIAS:-}
      SIGNING_KEY_PASSWORD: ${SIGNING_KEY_PASSWORD:-}
      SIGNING_KEYSTORE: ${SIGNING_KEYSTORE:-}
